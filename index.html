<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Theme before first paint: the visitor's saved choice, otherwise dark (see src/theme.ts).
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        // The prerendered home page is English: hide it from a Ukrainian visitor and on a deep
        // link (#/cv, #/projects) until the app renders the right page (src/startup.ts, main.tsx).
        var l = null;
        try { l = localStorage.getItem('locale'); } catch (e) {}
        var h = location.hash;
        if ((l && l !== 'en') || (h.indexOf('#/') === 0 && h !== '#/')) {
          document.documentElement.dataset.skipPrerender = '';
        }
      })();
    </script>
    <style>
      html[data-skip-prerender] #root > * { display: none; }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oleksandr Bryksin — React Native & Frontend Developer</title>
    <meta name="description" content="Oleksandr Bryksin, React Native &amp; frontend developer in Kyiv. Mobile apps with React Native and Expo, web products with React and Next.js." />
    <link rel="canonical" href="https://edgergard.github.io/portfolio/" />
    <!-- Link previews (Telegram, LinkedIn, Slack, X…). The image comes from scripts/og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oleksandr Bryksin" />
    <meta property="og:url" content="https://edgergard.github.io/portfolio/" />
    <meta property="og:title" content="Oleksandr Bryksin — React Native &amp; Frontend Developer" />
    <meta property="og:description" content="Oleksandr Bryksin, React Native &amp; frontend developer in Kyiv. Mobile apps with React Native and Expo, web products with React and Next.js." />
    <meta property="og:image" content="https://edgergard.github.io/portfolio/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oleksandr Bryksin, React Native &amp; Frontend Developer, next to the wine shader and 3D knot from the site" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oleksandr Bryksin — React Native &amp; Frontend Developer" />
    <meta name="twitter:description" content="Oleksandr Bryksin, React Native &amp; frontend developer in Kyiv. Mobile apps with React Native and Expo, web products with React and Next.js." />
    <meta name="twitter:image" content="https://edgergard.github.io/portfolio/og-image.jpg" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
